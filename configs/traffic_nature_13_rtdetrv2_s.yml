__include__: [
  '../rtdetrv2/rtdetrv2_r18vd_120e_coco.yml'
]

output_dir: ./output/traffic_nature_13_rtdetrv2_s_native640

num_classes: 13
remap_mscoco_category: False

# Fixed 640x640 benchmark input.
# Aspect ratio preserved, then padded to 640x640.
train_dataloader:
  dataset:
    img_folder: /home/nishchay/datasets/traffic_nature_13/images/train
    ann_file: /home/nishchay/datasets/traffic_nature_13/annotations/instances_train.json
    transforms:
      ops:
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}

  total_batch_size: 16
  num_workers: 2

  collate_fn:
    scales: ~

val_dataloader:
  dataset:
    img_folder: /home/nishchay/datasets/traffic_nature_13/images/val
    ann_file: /home/nishchay/datasets/traffic_nature_13/annotations/instances_val.json
    transforms:
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}

  total_batch_size: 16
  num_workers: 2
